# Output modes verified to encode WITHOUT touching RGA, 2026-09-18.
# Format: WIDTHxHEIGHT FPS SENSORWxSENSORH
#
# Both dimensions are multiples of 16. Anything else makes the encoder ask RGA to
# convert the frame, and the RGA driver corrupts kernel memory. That is why
# 1920x1080 is absent - 1080 is not a multiple of 16 - and 1920x1088 replaces it.
#
# The sensor column is informational: the driver keeps the sensor in its
# full-frame 3280x2464 mode and the ISP scales down, so every mode runs at the
# sensor's own 21 fps. Pinning smaller 30 fps sensor modes by hand wrecks capture
# throughput, so it is not done.
3280x2464 21 3280x2464
1920x1088 21 3280x2464
1600x1200 21 3280x2464
1280x720 21 3280x2464
640x480 21 3280x2464
